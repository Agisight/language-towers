const pages={
en:`<div class="pill">METHODOLOGY · v3</div><h1>Digital language capabilities, across ecosystems</h1><p class="lead">Language Towers maps which technologies people can use in their own languages — and what remains missing.</p>
<h2>Two distinct views</h2><p><strong>Provider view:</strong> choose Apple, Android (AOSP), Google, Yandex, Microsoft, or Independent / Community to see preliminary estimates for that ecosystem.</p><p><strong>Overall / Cross-platform:</strong> computed, not separately assessed. This view uses <strong>OR</strong>: if any evaluated provider or community implementation offers a technology, that implementation contributes to the overall score. The best supported implementation wins for each technology.</p>
<h2>Calculation</h2><div class="formula">overall(language, technology) = MAX(known provider scores)

overall(language, group) = MEAN(known technology results within that group)</div>
<p>For groups with detailed technology records, compute the maximum independently for each technology, then average available technology results. Do <strong>not</strong> take MAX of the completed group averages: that could overlook different providers implementing different technologies.</p>
<div class="example"><strong>Example — translation group</strong><table><tr><th>Technology</th><th>Apple</th><th>Google</th><th>Overall (OR)</th></tr><tr><td>Machine translation</td><td>0%</td><td>80%</td><td>80%</td></tr><tr><td>System localization</td><td>70%</td><td>20%</td><td>70%</td></tr><tr><td>App localization</td><td>40%</td><td>60%</td><td>60%</td></tr></table><strong>Group: (80 + 70 + 60) / 3 = 70%.</strong> A simple maximum of provider group averages would give the wrong answer.</div>
<h2>Missing values are not zero</h2><p><code>0</code> means an evaluated absence of support. <code>null</code> or a missing entry means <strong>not evaluated</strong>. Unknown values are never automatically counted as 0%. Overall scores based on partial coverage are marked with an asterisk. An apparently high score with limited evidence must not be interpreted as comprehensive coverage.</p>
<h2>Existing estimates and future detail</h2><p>Early versions contain group-level estimates in <code>platformScores</code>. Where no technology-level evidence exists, Overall uses the <strong>maximum known group estimate as a labeled fallback</strong>; this is provisional, not the final subtechnology-based method.</p><p>As research progresses, add <code>technologyScores[providerId][technologyId]</code>. The UI then uses best-known values for individual technologies, allowing an expandable floor-by-floor view later.</p>
<h2>Editing and sources</h2><p>The interactive matrix works offline. Select an individual provider to edit its estimates; <strong>Overall is read-only</strong> and updates automatically. Export/import JSON to share changes. Future versions should store dated evidence, confidence, links, and human-reviewed observations for every score.</p>
<h2>Scope and licensing</h2><p>Apple, Android (AOSP), Google, Yandex, Microsoft and community/open-source technologies are different sources. This is not an official vendor assessment. The application code is MIT licensed; language data, community corpora, external research and media may be governed by separate rights.</p>
<footer>Language Towers · English is the default interface language · <a href="index.html">Back to the towers</a></footer>`,
ru:`<div class="pill">МЕТОДИКА · v3</div><h1>Цифровые возможности языков в разных экосистемах</h1><p class="lead">Language Towers показывает, какие технологии доступны людям на их языках и каких возможностей пока не хватает.</p>
<h2>Два режима просмотра</h2><p><strong>Поставщик:</strong> Apple, Android (AOSP), Google, Яндекс, Microsoft или независимые решения сообществ. Показываем предварительные оценки для выбранной экосистемы.</p><p><strong>Все платформы / Cross-platform:</strong> результат <strong>вычисляется</strong> по правилу ИЛИ: для каждой технологии берётся лучшая известная реализация среди всех поставщиков и независимых проектов.</p>
<h2>Расчёт</h2><div class="formula">общая_оценка(язык, технология) = MAX(известных оценок поставщиков)

общая_оценка(язык, категория) = СРЕДНЕЕ(известных результатов подтехнологий)</div>
<p>Если внутри категории есть данные по отдельным технологиям, максимум вычисляется по каждой из них, затем результаты усредняются. <strong>Не берём максимум средних по категории у поставщиков</strong>: он не учитывает, что разные компании реализовали разные технологии.</p>
<div class="example"><strong>Пример — перевод</strong><table><tr><th>Технология</th><th>Apple</th><th>Google</th><th>Все платформы</th></tr><tr><td>Машинный перевод</td><td>0%</td><td>80%</td><td>80%</td></tr><tr><td>Локализация ОС</td><td>70%</td><td>20%</td><td>70%</td></tr><tr><td>Локализация приложений</td><td>40%</td><td>60%</td><td>60%</td></tr></table><strong>Категория: (80 + 70 + 60) / 3 = 70%.</strong></div>
<h2>Неизвестно — не значит ноль</h2><p><code>0</code> — проверенное отсутствие поддержки. <code>null</code> или отсутствие оценки — <strong>не исследовано</strong>. Неизвестные значения не превращаются автоматически в 0%. Неполные данные помечаются звёздочкой; высокая оценка при малом количестве источников не означает полной поддержки.</p>
<h2>Предварительные и детальные оценки</h2><p>Начальная версия содержит приблизительные оценки целых категорий в <code>platformScores</code>. Если подробных данных ещё нет, Overall временно использует <strong>максимум известных оценок категории</strong> — это упрощение, а не окончательная методика.</p><p>По мере исследования добавляются <code>technologyScores[providerId][technologyId]</code>. Тогда общая оценка строится из результатов отдельных технологий.</p>
<h2>Редактирование и источники</h2><p>Таблица работает офлайн. Выберите конкретного поставщика, чтобы редактировать данные. Общий режим доступен <strong>только для просмотра</strong> и пересчитывается автоматически. JSON можно экспортировать и загружать. В дальнейшем добавим даты, ссылки на доказательства, уверенность оценки и проверку экспертами.</p>
<h2>Область применения и лицензии</h2><p>Apple, Android (AOSP), Google, Яндекс, Microsoft и независимые решения учитываются отдельно. Это не официальные оценки компаний. Код приложения распространяется под MIT; права на корпуса и сторонние материалы учитываются отдельно.</p>
<footer>Language Towers · английский интерфейс по умолчанию · <a href="index.html">К башням</a></footer>`};
const q=new URLSearchParams(location.search).get('lang');const sel=document.getElementById('locale');const saved=(q==='ru')?'ru':'en';sel.value=saved;function draw(){document.documentElement.lang=sel.value;document.getElementById('content').innerHTML=pages[sel.value];document.getElementById('back').textContent=sel.value==='ru'?'← К башням':'← Language Towers';}sel.addEventListener('change',draw);draw();
</script></body></html>
